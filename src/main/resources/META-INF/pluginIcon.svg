<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1a1b2e"/>
      <stop offset="1" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="activeEdge" x1="20" y1="11" x2="30" y2="15" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4f9ef8"/>
      <stop offset="1" stop-color="#7f52ff"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="40" height="40" rx="9" fill="url(#bg)"/>

  <!-- Rail tracks at bottom -->
  <line x1="4" y1="34" x2="36" y2="34" stroke="#2d5a8e" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="4" y1="37" x2="36" y2="37" stroke="#2d5a8e" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="8"  y1="32.5" x2="8"  y2="38.5" stroke="#2d5a8e" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="16" y1="32.5" x2="16" y2="38.5" stroke="#2d5a8e" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="24" y1="32.5" x2="24" y2="38.5" stroke="#2d5a8e" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="32" y1="32.5" x2="32" y2="38.5" stroke="#2d5a8e" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Tree edges -->
  <line x1="20" y1="11" x2="11" y2="18" stroke="#3a3d52" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="20" y1="11" x2="29" y2="18" stroke="url(#activeEdge)" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="11" y1="21" x2="7"  y2="27" stroke="#3a3d52" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="11" y1="21" x2="15" y2="27" stroke="#3a3d52" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Root node -->
  <circle cx="20" cy="8"  r="3.8" fill="#4f9ef8"/>
  <circle cx="20" cy="8"  r="2"   fill="#1a2a4a"/>

  <!-- Left branch node -->
  <circle cx="11" cy="19.5" r="3" fill="#3a3d52" stroke="#5a5d72" stroke-width="1"/>

  <!-- Active right node (glowing) -->
  <circle cx="29" cy="19.5" r="4"   fill="#7f52ff" opacity="0.25"/>
  <circle cx="29" cy="19.5" r="3"   fill="#7f52ff"/>
  <circle cx="29" cy="19.5" r="1.4" fill="#c9aaff"/>

  <!-- Leaf nodes -->
  <circle cx="7"  cy="28" r="2.2" fill="#3a3d52" stroke="#4a4d62" stroke-width="0.8"/>
  <circle cx="15" cy="28" r="2.2" fill="#3a3d52" stroke="#4a4d62" stroke-width="0.8"/>
</svg>